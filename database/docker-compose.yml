services:
  postgres:
    image: postgres:16
    container_name: tonemind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tonemind
      POSTGRES_USER: tonemind
      POSTGRES_PASSWORD: tonemind
    ports:
      - "5432:5432"
    volumes:
      - tonemind-postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tonemind -d tonemind"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tonemind-postgres-data:
