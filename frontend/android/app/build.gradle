plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "ai.tonemind.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "ai.tonemind.app"
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        manifestPlaceholders += [appAuthRedirectScheme: "ai.tonemind.app"]
    }

    signingConfigs {
        release {
            storeFile = file(System.getenv("TONEMIND_KEYSTORE") ?: "debug.keystore")
            storePassword = System.getenv("TONEMIND_KEYSTORE_PASSWORD") ?: "android"
            keyAlias = System.getenv("TONEMIND_KEY_ALIAS") ?: "androiddebugkey"
            keyPassword = System.getenv("TONEMIND_KEY_PASSWORD") ?: "android"
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

flutter {
    source = "../.."
}
